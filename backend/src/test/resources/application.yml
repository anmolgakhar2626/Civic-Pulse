spring:
  datasource:
    url: jdbc:h2:mem:civicpulse_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/civicpulse_test
  sql:
    init:
      mode: never

app:
  mqtt:
    enabled: false

