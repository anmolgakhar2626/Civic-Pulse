spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/civicpulse_db}
    username: ${DATABASE_USERNAME:civicpulse}
    password: ${DATABASE_PASSWORD:civicpulse_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: CivicPulseProdHikariCP

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://mongodb:27017/civicpulse}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

logging:
  level:
    root: INFO
    com.smartcity: INFO
    org.springframework.data: WARN
    org.flywaydb: INFO
