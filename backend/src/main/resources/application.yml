spring:
  application:
    name: civicpulse-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:c3VwZXJzZWNyZXRqd3RzZWNyZXRrZXlmb3JzbWFydGNpdHljb21tYW5kY2VudHJlY2l2aWNwdWxzZQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@civicpulse.gov}
    password: ${ADMIN_PASSWORD:Admin@CivicPulse2026}
    fullname: ${ADMIN_FULLNAME:System Administrator}
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    client-id: ${MQTT_CLIENT_ID:civicpulse-backend}
    data-topic: ${MQTT_DATA_TOPIC:smartcity/sensors/+/data}
    status-topic: ${MQTT_STATUS_TOPIC:smartcity/sensors/+/status}
    qos: ${MQTT_QOS:1}
    enabled: ${MQTT_ENABLED:true}
  iot:
    thresholds:
      pm25-critical: ${IOT_PM25_CRITICAL:300.0}
      pm25-high: ${IOT_PM25_HIGH:200.0}
      pm25-medium: ${IOT_PM25_MEDIUM:100.0}
      water-level-danger: ${IOT_WATER_DANGER:80.0}
      water-level-critical: ${IOT_WATER_CRITICAL:95.0}
      waste-level-overflow: ${IOT_WASTE_OVERFLOW:90.0}
      waste-level-critical: ${IOT_WASTE_CRITICAL:98.0}
      gas-ppm-danger: ${IOT_GAS_DANGER:100.0}
      gas-ppm-critical: ${IOT_GAS_CRITICAL:250.0}
      smoke-ppm-danger: ${IOT_SMOKE_DANGER:50.0}
      smoke-ppm-critical: ${IOT_SMOKE_CRITICAL:100.0}
      electrical-hazard-threshold: ${IOT_ELECTRICAL_THRESHOLD:1.0}
  sla:
    scheduler:
      enabled: ${SLA_SCHEDULER_ENABLED:true}
      interval-ms: ${SLA_SCHEDULER_INTERVAL_MS:30000}
      initial-delay-ms: ${SLA_SCHEDULER_INITIAL_DELAY_MS:5000}
    warning-threshold-percent: ${SLA_WARNING_THRESHOLD_PERCENT:20}
  sms:
    provider: ${SMARTCITY_SMS_PROVIDER:mock} # mock, twilio, fast2sms, http
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
    fast2sms:
      api-key: ${FAST2SMS_API_KEY:}
    http:
      gateway-url: ${SMS_GATEWAY_URL:}
      api-key: ${SMS_GATEWAY_API_KEY:}
      sender-id: ${SMS_GATEWAY_SENDER_ID:CIVICPULSE}




